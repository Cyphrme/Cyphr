[package]
categories             = ["authentication", "cryptography"]
description            = "Cyphr self-sovereign identity protocol"
documentation          = "https://docs.rs/cyphr"
edition.workspace      = true
homepage.workspace     = true
keywords               = ["identity", "authentication", "cryptography", "self-sovereign"]
license-file.workspace = true
name                   = "cyphr"
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version                = "0.1.0"

[dependencies]
eml     = { workspace = true }
futures = { workspace = true }

coz        = { workspace = true }
indexmap   = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

[features]
# Exposes test-oracle functions (e.g. compute_pr) that are otherwise
# cfg(test)-only, so dependent crates' own tests can cross-check against
# them. Only ever enable this from a [dev-dependencies] declaration
# (as cyphr-storage does): dev-dependency features aren't compiled into
# a normal `cargo build`/release artifact. Enabling it from a
# [dependencies] block instead would re-expose compute_pr in a real
# production build, defeating the point of the gate.
test-utils = []

[dev-dependencies]
proptest      = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
storage-fjall = { workspace = true }
tempfile      = "3"
test-fixtures = { path = "../test-fixtures" }
