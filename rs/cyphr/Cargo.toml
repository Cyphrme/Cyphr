[package]
categories             = ["authentication", "cryptography"]
description            = "Cyphr self-sovereign identity protocol"
documentation          = "https://docs.rs/cyphr"
edition.workspace      = true
homepage.workspace     = true
keywords               = ["identity", "authentication", "cryptography", "self-sovereign"]
license-file.workspace = true
name                   = "cyphr"
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version                = "0.1.0"

[dependencies]
eml        = { workspace = true }
futures    = { workspace = true }
polydigest = { workspace = true }

coz        = { workspace = true }
indexmap   = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

[features]
# Exposes test-oracle functions (e.g. compute_pr) and the state-setup hook
# pre_revoke_key, which are otherwise cfg(test)-only, so dependent crates'
# own tests can cross-check against them. Only enable this from test-only
# crates: a [dev-dependencies] declaration (as cyphr-storage does) or the
# test-fixtures crate, which no production crate depends on outside its
# own [dev-dependencies]. Enabling it from a production [dependencies]
# block would re-expose these in a real release build.
test-utils = []

[dev-dependencies]
proptest      = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
storage-fjall = { workspace = true }
tempfile      = "3"
test-fixtures = { path = "../test-fixtures" }
