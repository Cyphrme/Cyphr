[package]
categories             = ["web-programming::http-server", "cryptography"]
description            = "Cyphr Protocol authority server (MSS API)"
documentation          = "https://docs.rs/cyphr-server"
edition.workspace      = true
homepage.workspace     = true
keywords               = ["server", "identity", "authentication", "cryptography"]
license-file.workspace = true
name                   = "cyphr-server"
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version                = "0.1.0"

[[bin]]
name = "cyphr-server"
path = "src/main.rs"

[dependencies]
axum.workspace               = true
blake3.workspace             = true
clap.workspace               = true
coz.workspace                = true
cyphr                        = { path = "../cyphr", version = "0.1.0" }
cyphr-blob-fjall             = { path = "../cyphr-blob-fjall", version = "0.1.0" }
cyphr-index-fjall            = { path = "../cyphr-index-fjall", version = "0.1.0" }
cyphr-storage                = { path = "../cyphr-storage", version = "0.1.0" }
eml.workspace                = true
figment.workspace            = true
fjall.workspace              = true
futures.workspace            = true
rand                         = "0.8"
serde.workspace              = true
serde_json.workspace         = true
sha2                         = "0.10"
subtle                       = "2"
thiserror.workspace          = true
tokio.workspace              = true
tower                        = "0.5"
tower-http.workspace         = true
tracing.workspace            = true
tracing-subscriber.workspace = true
uuid.workspace               = true

[dev-dependencies]
blake3         = { workspace = true }
coz            = { workspace = true }
http-body-util = "0.1"
proptest       = { workspace = true }
serde_json     = { workspace = true }
tempfile       = "3"
test-fixtures  = { path = "../test-fixtures" }
tokio          = { workspace = true }
tower          = { version = "0.5", features = ["util"] }
