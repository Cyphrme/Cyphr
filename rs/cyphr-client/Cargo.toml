[package]
categories             = ["authentication", "cryptography"]
description            = "Carrier-independent Cyphr sync client: verify core plus transports"
documentation          = "https://docs.rs/cyphr-client"
edition.workspace      = true
homepage.workspace     = true
keywords               = ["identity", "sync", "cryptography", "self-sovereign"]
license-file.workspace = true
name                   = "cyphr-client"
repository.workspace   = true
rust-version.workspace = true
version                = "0.1.0"

[features]
default = ["http", "noise"]
# The HTTP transport. Everything outside `http` is the I/O-free verify core:
# `cargo tree --no-default-features` must list no async runtime or socket
# crate.
http = ["dep:reqwest"]
# The Noise transport (`transport` module): principal-authenticated sessions
# over TCP. Pulls the Noise implementation and an async runtime, so it is
# off the I/O-free verify core's tree.
noise = ["dep:snow", "dep:tokio"]

[dependencies]
coz = { workspace = true }
cyphr = { path = "../cyphr", version = "0.1.0" }
# TLS is rustls with the bundled webpki roots and the `ring` provider (already
# in the tree through `snow`): no native-tls, openssl or second provider, so
# a peer is verified the same on every platform.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-webpki-roots",
], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
snow = { version = "=0.10.0", optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = [
  "net",
  "io-util",
  "time",
] }

[dev-dependencies]
tokio = { workspace = true, features = [
  "rt",
  "macros",
  "net",
  "io-util",
  "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
