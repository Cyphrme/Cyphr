[package]
edition = "2024"
name    = "cyphr-fuzz"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
coz           = { workspace = true }
libfuzzer-sys = "0.4"
serde_json    = { workspace = true }
tokio         = { workspace = true, features = ["rt", "macros"] }

[dependencies.cyphr]
path = "../cyphr"

[dependencies.cyphr-client]
default-features = false
path             = "../cyphr-client"

[dependencies.cyphr-server]
path = "../cyphr-server"

[dependencies.cyphr-storage]
path = "../cyphr-storage"

[[bin]]
bench = false
doc   = false
name  = "fuzz_coz_parser"
path  = "fuzz_targets/fuzz_coz_parser.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "fuzz_reindex"
path  = "fuzz_targets/fuzz_reindex.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "fuzz_bearer_token"
path  = "fuzz_targets/fuzz_bearer_token.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "fuzz_login_body"
path  = "fuzz_targets/fuzz_login_body.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "fuzz_naked_revoke"
path  = "fuzz_targets/fuzz_naked_revoke.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "fuzz_push_bundle"
path  = "fuzz_targets/fuzz_push_bundle.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "fuzz_tip_report"
path  = "fuzz_targets/fuzz_tip_report.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "fuzz_patch_envelope"
path  = "fuzz_targets/fuzz_patch_envelope.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "fuzz_evidence"
path  = "fuzz_targets/fuzz_evidence.rs"
test  = false
