[package]
categories             = ["authentication", "cryptography", "database"]
description            = "Storage backends for Cyphr identity protocol"
documentation          = "https://docs.rs/cyphr-storage"
edition.workspace      = true
homepage.workspace     = true
keywords               = ["identity", "storage", "cryptography", "self-sovereign"]
license-file.workspace = true
name                   = "cyphr-storage"
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version                = "0.1.0"

[features]
# Exposes `index::conformance` and `blob::conformance`, the shared Indexer
# and BlobStore behavioral test suites, outside `#[cfg(test)]` so another
# crate's Indexer/BlobStore implementation can add this crate as a
# dev-dependency with this feature enabled and hold its own backend to the
# same conformance functions MemoryIndexer's/MemoryBlobStore's tests use.
conformance-tests = []

[dependencies]
blake3     = { workspace = true }
coz        = { workspace = true }
cyphr      = { path = "../cyphr", version = "0.1.0" }
serde      = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror  = { workspace = true }
tokio      = { workspace = true, features = ["io-util", "sync"] }
tracing    = { workspace = true }

[dev-dependencies]
cyphr              = { path = "../cyphr", version = "0.1.0", features = ["test-utils"] }
cyphr-blob-fjall   = { path = "../cyphr-blob-fjall", version = "0.1.0" }
cyphr-index-fjall  = { path = "../cyphr-index-fjall", version = "0.1.0" }
fjall              = { workspace = true }
proptest           = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tempfile           = "3"
test-fixtures      = { path = "../test-fixtures" }
