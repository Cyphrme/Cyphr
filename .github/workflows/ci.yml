name: CI

on:
  push:
    branches: [main, master, campaign/mvp-close]
  pull_request:
    branches: [main, master, campaign/mvp-close]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # macOS is non-gating until an undiagnosed macOS-only failure is
    # resolved: cyphr-scenarios s04_theft ("verdict evidence differs from
    # the items the peers serve") fails there and passes on Linux. Ubuntu
    # still gates.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v4
      # The spec-conformance map test reads SPEC.md at be0663f, which lives
      # only on the zami branch and is absent from the shallow checkout.
      # Fetch the pinned commit, not the moving branch tip: the map is
      # checked against one fixed spec.
      - name: Fetch the pinned spec commit
        working-directory: .
        run: git fetch --no-tags origin be0663f58086ac20131cc16a14944cf96c025609
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      # Every ignored test must say why: a RED( marker, a
      # QUARANTINE(#issue) marker, or a "large:" reason (a test too slow
      # for the default run). A bare #[ignore] hides failures. Only
      # attribute lines count, not comments that mention one.
      - name: Guard ignored tests
        working-directory: .
        run: test $(git grep -nE "^[[:space:]]*#\[ignore" -- rs | grep -vE "RED\(|QUARANTINE\(#[0-9]+\)|large:" | wc -l) -eq 0
      # The CLI durability test counts fsyncs by tracing the binary.
      - name: Install strace
        if: runner.os == 'Linux'
        run: sudo apt-get install -y strace
      - run: cargo build --workspace --all-targets --verbose
      # The packaged example config must keep starting a server and the
      # server must keep refusing unknown keys; this regressed silently once
      # because only a manual run exercised it.
      - name: Smoke the packaged example config
        run: bash ../packaging/smoke.sh target/debug/cyphr-server
      - run: cargo test --workspace --verbose
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The workspace-wide build above unifies features, so the dev-only
      # `test-utils` feature of `cyphr` is on there. Selecting just the
      # shipped binaries builds them as a release does, without it.
      - name: Check the shipped binaries without dev features
        run: cargo check -p cyphr-server -p cyphr-cli

  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs/fuzz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Bounded smoke runs, not continuous fuzzing: catch crashes and
      # regressions on every push without a dedicated fuzzing corpus/farm.
      - run: cargo fuzz run fuzz_coz_parser -- -max_total_time=60
      - run: cargo fuzz run fuzz_reindex -- -max_total_time=60
      - run: cargo fuzz run fuzz_patch_envelope -- -max_total_time=60
      - run: cargo fuzz run fuzz_bearer_token -- -max_total_time=60
      - run: cargo fuzz run fuzz_login_body -- -max_total_time=60
      - run: cargo fuzz run fuzz_naked_revoke -- -max_total_time=60
      - run: cargo fuzz run fuzz_push_bundle -- -max_total_time=60
      - run: cargo fuzz run fuzz_tip_report -- -max_total_time=60
      - run: cargo fuzz run fuzz_evidence -- -max_total_time=60

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v34
      - name: Check formatting
        run: nix-shell --run "treefmt --fail-on-change"

  rust-audit:
    runs-on: ubuntu-latest
    # audit-check reports through a check run, which the default
    # read-only token cannot create.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rs

  fixture-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      - name: Regenerate golden fixtures from intents
        working-directory: rs
        run: |
          cargo run -p fixture-gen -- \
            --pool ../tests/keys/pool.toml \
            generate -r ../tests/intents/ ../tests/golden/
      - name: Fail if tests/golden drifted from tests/intents
        run: git diff --exit-code -- tests/golden

  # Checks the minimum Rust version the workspace declares in
  # `rust-version`, read from Cargo.toml so the two cannot drift.
  # `rs/rust-toolchain.toml` pins a nightly for formatting; the
  # RUSTUP_TOOLCHAIN override is what makes this job build with the
  # declared version instead.
  rust-msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v4
      - name: Read the declared minimum Rust version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      - run: cargo check --workspace --all-features --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  # Releases ship Windows binaries; this builds the two shipped binaries
  # there on every change so a Windows break shows before a release tag.
  # Build only.
  rust-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      - run: cargo build -p cyphr-cli -p cyphr-server --locked

  # The core runs in the browser: it must keep building without ambient
  # OS services (the verifier clock is injected, see Principal::set_clock).
  rust-wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      - run: cargo check --target wasm32-unknown-unknown -p cyphr --locked
