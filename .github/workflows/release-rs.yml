name: Rust Release

on:
  push:
    tags:
      - "rs/v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.cliff.outputs.content }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#*/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >-
            --latest
            --strip header
            --include-path "rs/**"
            --include-path "tests/**"
            --include-path "SPEC.md"
            --include-path "docs/**"

  build-rs:
    needs: [changelog]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: cyphr-x86_64-linux
            server_artifact: cyphr-server-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: cyphr-aarch64-linux
            server_artifact: cyphr-server-aarch64-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: cyphr-x86_64-macos
            server_artifact: cyphr-server-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: cyphr-aarch64-macos
            server_artifact: cyphr-server-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: cyphr-x86_64-windows
            server_artifact: cyphr-server-x86_64-windows
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: cyphr-aarch64-windows
            server_artifact: cyphr-server-aarch64-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked -p cyphr-cli -p cyphr-server

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz cyphr
          tar czf ../../../${{ matrix.server_artifact }}.tar.gz cyphr-server
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip cyphr.exe
          7z a ../../../${{ matrix.server_artifact }}.zip cyphr-server.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            rs/${{ matrix.artifact }}.tar.gz
            rs/${{ matrix.artifact }}.zip
            rs/${{ matrix.server_artifact }}.tar.gz
            rs/${{ matrix.server_artifact }}.zip
          if-no-files-found: error

  release:
    needs: [changelog, build-rs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Both are required by actions/attest-build-provenance: the OIDC token
      # identifies this workflow run, and the attestation is stored on the
      # repository.
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Checksums cover every attached archive, sorted for a stable file.
      - name: Checksums
        working-directory: artifacts
        run: |
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      # SLSA v1 build provenance (GitHub artifact attestations, Sigstore
      # keyless). Verify a download with:
      #   gh attestation verify <file> --repo Cyphrme/Cyphr
      # and its checksum with: sha256sum --check --ignore-missing SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "rs ${{ needs.changelog.outputs.version }}"
          body: ${{ needs.changelog.outputs.body }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/SHA256SUMS
          fail_on_unmatched_files: false
