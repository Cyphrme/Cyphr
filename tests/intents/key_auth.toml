# Key authority vectors (security sweep D3).
#
# SPEC 6.4: a revoked key is never trusted again. SPEC 6.2: only a deleted
# key may be re-added. A `key/create` naming a revoked key must be
# rejected with KeyRevoked.

# ============================================================================
# D3: re-adding a revoked key
# ============================================================================

[[test]]
name      = "revoked_key_readd_fails"
principal = ["golden", "key_a"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, rvk = 1700000000, signer = "key_a", typ = "cyphr.me/cyphr/key/revoke" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000001, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[test.expected]
error = "KeyRevoked"
