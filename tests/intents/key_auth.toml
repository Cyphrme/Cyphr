# Key authority vectors (security sweep D3).
#
# SPEC 6.4: a revoked key is never trusted again. SPEC 6.2: only a deleted
# key may be re-added. A `key/create` naming a revoked key must be
# rejected with KeyRevoked.

# ============================================================================
# D3: re-adding a revoked key
# ============================================================================

[[test]]
name      = "revoked_key_readd_fails"
principal = ["golden", "key_a"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, rvk = 1700000000, signer = "key_a", typ = "cyphr.me/cyphr/key/revoke" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000001, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[test.expected]
error = "KeyRevoked"

# ============================================================================
# Genesis of a key revoked before it (SPEC 6.4, 7.7)
# ============================================================================
#
# `setup.revoke_key` hands genesis a genesis key that already carries a
# revocation. Genesis creates every key by `key/create`, the genesis key
# included (7.7), and a revoked key is never trusted again (6.4), so
# implicit genesis (one key) and explicit genesis (a genesis key and the
# keys it creates) refuse it with the same error.

[[test]]
name      = "implicit_genesis_refuses_revoked_key"
principal = ["golden"]

[test.setup]
revoke_at  = 1700000000
revoke_key = "golden"

[test.expected]
error = "KeyRevoked"

[[test]]
name      = "explicit_genesis_refuses_revoked_genesis_key"
principal = ["golden", "key_a"]

[test.setup]
revoke_at  = 1700000000
revoke_key = "golden"

[test.expected]
error = "KeyRevoked"
