# Data Action Constraints Intent Tests
#
# These tests target specific constraints from docs/specs/transactions.md.

# A data action carrying `pre` is accepted: DT has no chain (SPEC 2.3.3),
# so the field has no protocol meaning.
[[test]]
name      = "data_action_with_pre_is_accepted"
principal = ["golden"]

# The genesis commit (SPEC 5.1): a data action needs a principal to
# record into.
[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "golden", typ = "cyphr.me/cyphr/key/create" },
  ],
  [
    { now = 1700000000, signer = "golden", typ = "cyphr.me/cyphr/principal/create" },
  ],
]

[[test.action]]
now    = 1700000001
signer = "golden"
typ    = "cyphr.me/comment/create"

[test.override]
# inject_pre forces the generator to insert a "pre" field into the action payload
inject_pre = true

[test.expected]
level = 4
