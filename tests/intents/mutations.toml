# Transaction mutation tests

# Test 1: L1→L3 transition via key/create
[[test]]
name      = "key_add_increases_count"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[test.expected]
key_count = 2
level     = 3

# Test 2: key/create changes AS/PS but not PR
[[test]]
name      = "key_add_changes_state"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[test.expected]
key_count = 2
level     = 3

# Test 3: key/delete removes a key from L3 account
[[test]]
name      = "key_delete_decreases_count"
principal = ["golden", "key_a"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/delete" },
  ],
]

[test.expected]
key_count = 1
level     = 3

# Test 4: L2 atomic key replacement
[[test]]
name      = "key_replace_single_key"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/replace" },
  ],
]

[test.expected]
key_count = 1

# Test 5: Self-revoke (key revokes itself)
[[test]]
name      = "self_revoke_moves_to_revoked"
principal = ["golden", "key_a"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, rvk = 1700000000, signer = "key_a", typ = "cyphr.me/cyphr/key/revoke" },
  ],
]

[test.expected]
key_count = 1

# Test 7: Multi-step transaction sequence
[[test]]
name      = "transaction_sequence_replay"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000001, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000002, signer = "golden", target = "key_b", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000003, signer = "key_a", target = "key_b", typ = "cyphr.me/cyphr/key/delete" },
  ],
]

[test.expected]
key_count = 2

# ============================================================================
# Nonces (SPEC 10.1, 10.2)
#
# A nonce is opaque: `target` names a pool key only to borrow its thumbprint
# as a 256-bit value, so each `id` is a bare SHA-256 nonce (signed by an
# ES256 key). The nonce never becomes a key.
# ============================================================================

# A KT nonce enters the Key Root: KR = H(sort(tmb_golden, nonce)).
[[test]]
name      = "nonce_kt_create_changes_kr"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "bob", typ = "cyphr.me/cyphr/AT/KT/nonce/create" },
  ],
]

[test.expected]
key_count = 1

# An AT nonce enters the Auth Root only: KR is untouched.
[[test]]
name      = "nonce_at_create_changes_ar_not_kr"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "bob", typ = "cyphr.me/cyphr/AT/nonce/create" },
  ],
]

[test.expected]
key_count = 1

# A PR nonce enters the Principal Root only: KR, AR and SR are untouched.
[[test]]
name      = "nonce_pr_create_changes_pr_only"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "bob", typ = "cyphr.me/cyphr/nonce/create" },
  ],
]

[test.expected]
key_count = 1

# nonce/delete undoes nonce/create: the roots return to genesis.
[[test]]
name      = "nonce_kt_delete_restores_roots"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "bob", typ = "cyphr.me/cyphr/AT/KT/nonce/create" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000001, signer = "golden", target = "bob", typ = "cyphr.me/cyphr/AT/KT/nonce/delete" },
  ],
]

[test.expected]
key_count = 1

# Two nonces sit at one level and are deleted one at a time:
# KR = H(sort(tmb_golden, nonce_carol)) after the first delete.
[[test]]
name      = "nonce_two_kt_deleted_one_at_a_time"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "bob", typ = "cyphr.me/cyphr/AT/KT/nonce/create" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000001, signer = "golden", target = "carol", typ = "cyphr.me/cyphr/AT/KT/nonce/create" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000002, signer = "golden", target = "bob", typ = "cyphr.me/cyphr/AT/KT/nonce/delete" },
  ],
]

[test.expected]
key_count = 1

# One key, two principals: the same key reaches a distinct PG once a nonce
# is in the tree (SPEC 5.1). Compare `pg` with `principal_create_single_key_without_nonce`.
[[test]]
name      = "nonce_kt_principal_reaches_distinct_pg"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "bob", typ = "cyphr.me/cyphr/AT/KT/nonce/create" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000001, signer = "golden", typ = "cyphr.me/cyphr/principal/create" },
  ],
]

[test.expected]
key_count = 1

# The same key with no nonce, the contrast for the PG above.
[[test]]
name      = "principal_create_single_key_without_nonce"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", typ = "cyphr.me/cyphr/principal/create" },
  ],
]

[test.expected]
key_count = 1

# ============================================================================# n-arity (SPEC 4 line 463): a collection node holds more than 256 items.# Each level has an overflow vector (300 nonces, a second fold level) and a# shrink vector: the same 300 nonces created, then the surplus deleted back# to a full 256-item node. The shrink vector's final roots equal the roots of# the vector that creates only the 256-item set.# ============================================================================
