# Error Condition Test Vectors
# Per SPEC §14 - tests for error conditions

# ============================================================================
# Unsupported algorithm test (genesis-only error)
# ============================================================================

# Genesis with unsupported algorithm fails during principal creation
[[test]]
name      = "unsupported_algorithm_fails"
principal = ["unsupported_key"]

[test.expected]
error = "UnknownAlg"

# Genesis naming the same key twice is refused, not collapsed to one key
[[test]]
name      = "duplicate_genesis_key_fails"
principal = ["golden", "key_a", "golden"]

[test.expected]
error = "DuplicateKey"

# Genesis never creates a key implicitly (SPEC 5.1 step 1, 7.7 Example 1):
# principal/create while a genesis key lacks its key/create is refused
[[test]]
name      = "principal_create_without_genesis_key_create_fails"
principal = ["golden", "key_a"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "golden", typ = "cyphr.me/cyphr/key/create" },
  ],
  [
    { now = 1700000000, signer = "golden", typ = "cyphr.me/cyphr/principal/create" },
  ],
]

[test.expected]
error = "GenesisIncomplete"

# A genesis opens with the genesis key's own key/create (SPEC 5.1 steps 1-2,
# 5.3; 13.2 step 3: before it KR is empty, so no other coz verifies). Here
# the genesis key first creates another key, before creating itself.
[[test]]
name      = "genesis_not_opened_by_self_create_fails"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
  [
    { now = 1700000000, signer = "golden", target = "golden", typ = "cyphr.me/cyphr/key/create" },
  ],
  [
    { now = 1700000000, signer = "golden", typ = "cyphr.me/cyphr/principal/create" },
  ],
]

[test.expected]
error = "UnknownKey"

# A genesis key signs only once its own key/create is applied (SPEC 5.1
# steps 1-2; 13.2 step 3: the signer's tmb must be in the current KR). Here
# key_a, a genesis key not yet created, signs the key/create of alice.
[[test]]
name      = "uncreated_genesis_key_signs_fails"
principal = ["golden", "key_a", "alice"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "golden", typ = "cyphr.me/cyphr/key/create" },
  ],
  [
    { now = 1700000000, signer = "key_a", target = "alice", typ = "cyphr.me/cyphr/key/create" },
  ],
  [
    { now = 1700000000, signer = "golden", typ = "cyphr.me/cyphr/principal/create" },
  ],
]

[test.expected]
error = "UnknownKey"

# The PG is the state at the principal/create (SPEC 5.1 step 3: its id is
# the future SR), so only the commit/create may follow it in the genesis
# commit; a key/create after it is refused.
[[test]]
name      = "mutation_after_principal_create_fails"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "golden", typ = "cyphr.me/cyphr/key/create" },
  ],
  [
    { now = 1700000000, signer = "golden", typ = "cyphr.me/cyphr/principal/create" },
  ],
  [
    { now = 1700000000, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[test.expected]
error = "GenesisIncomplete"

# ============================================================================
# Revoked key tests
# Need setup.revoke_key to pre-revoke a key before the test
# ============================================================================

# Transaction signed by a revoked key fails with KeyRevoked (key_a revokes
# itself in the commit after the genesis)
[[test]]
name      = "revoked_key_fails"
principal = ["golden", "key_a"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, rvk = 1700000000, signer = "key_a", typ = "cyphr.me/cyphr/key/revoke" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000001, signer = "key_a", target = "golden", typ = "cyphr.me/cyphr/key/delete" },
  ],
]

[test.expected]
error = "KeyRevoked"

# Action signed by a revoked key fails with KeyRevoked
[[test]]
name      = "action_revoked_key_fails"
principal = ["golden", "key_a"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, rvk = 1700000000, signer = "key_a", typ = "cyphr.me/cyphr/key/revoke" },
  ],
]

[[test.action]]
msg    = "Action from revoked key"
now    = 1700000001
signer = "key_a"
typ    = "cyphr.me/action"

[test.expected]
error = "KeyRevoked"

# ============================================================================
# Duplicate key test
# Adding key already in KS fails with DuplicateKey
# ============================================================================

[[test]]
name      = "duplicate_key_fails"
principal = ["golden", "key_a"]

# The genesis commit already created both keys (SPEC 5.3); this key/create
# re-adds the genesis key.
[[test.commit]]
tx = [
  [
    { now = 1700000001, signer = "key_a", target = "golden", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[test.expected]
error = "DuplicateKey"

# ============================================================================
# Unknown key test (signer not in principal)
# ============================================================================

[[test]]
name      = "unknown_key_fails"
principal = ["golden"]          # Only golden in principal

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "key_a", target = "key_b", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[test.expected]
error = "UnknownKey"

# Action signed by unknown key fails with UnknownKey
[[test]]
name      = "action_unknown_signer_fails"
principal = ["golden"]                    # Only golden in principal

[[test.action]]
msg    = "Action from unknown key"
now    = 1700000001
signer = "key_a"                   # key_a is NOT in principal
typ    = "cyphr.me/action"

[test.expected]
error = "UnknownKey"

# ============================================================================
# Timestamp past tests (multi-commit, error on commit 2)
# ============================================================================

[[test]]
name      = "timestamp_past_fails"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000100, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000050, signer = "golden", target = "key_b", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[test.expected]
error = "TimestampPast"

# Action timestamp past (multi-action, error on action 2)
[[test]]
name      = "action_timestamp_past_fails"
principal = ["golden"]

[[test.action]]
msg    = "First action"
now    = 1700000100
signer = "golden"
typ    = "cyphr.me/action"

[[test.action]]
msg    = "Second action with older timestamp"
now    = 1700000050                           # Earlier than action 1!
signer = "golden"
typ    = "cyphr.me/action"

[test.expected]
error = "TimestampPast"

# ============================================================================
# Constraint-driven tests (from coverage audit)
# ============================================================================

# [no-revoke-non-self]: Revoke MUST be self-signed — signer must match target.
# Here alice tries to revoke bob. Spec says MUST reject.
[[test]]
name      = "revoke_non_self_fails"
principal = ["alice", "bob"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, rvk = 1700000000, signer = "alice", target = "bob", typ = "cyphr.me/cyphr/key/revoke" },
  ],
]

[test.expected]
error = "[no-revoke-non-self]"

# key/delete of unknown key (key not in principal)
[[test]]
name      = "delete_unknown_key_fails"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/delete" },
  ],
]

[test.expected]
error = "UnknownSigner"

# ============================================================================
# Transaction coz reuse (SPEC §7.6)
# The identical key/create coz is submitted a second time after the key was
# deleted, so it is state-valid again; the principal still rejects it with
# CozReuse because the first inclusion is authoritative.
# ============================================================================

[[test]]
name      = "coz_reuse_fails"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/delete" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[test.expected]
error = "CozReuse"

# ============================================================================
# Nonce bit length (SPEC 10.2): a nonce must be as wide as the algorithm it
# is under. `target` borrows a pool key's thumbprint as the value, so a bare
# `id` is as wide as that key's hash.
# ============================================================================

# A 48-byte value under an ES256 signer (SHA-256, 32 bytes).
[[test]]
name      = "nonce_sha256_signer_with_48_byte_value_fails"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "diana_es384", typ = "cyphr.me/cyphr/AT/KT/nonce/create" },
  ],
]

[test.expected]
error = "MalformedPayload"

# A 32-byte value under an ES384 signer (SHA-384, 48 bytes).
[[test]]
name      = "nonce_sha384_signer_with_32_byte_value_fails"
principal = ["diana_es384"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "diana_es384", target = "golden", typ = "cyphr.me/cyphr/AT/nonce/create" },
  ],
]

[test.expected]
error = "MalformedPayload"

# Raw ids (`raw:` target) reach widths no pool thumbprint has.
[[test]]
name      = "nonce_sha256_with_31_bytes_fails"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "raw:SHA-256:paWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpQ", typ = "cyphr.me/cyphr/AT/KT/nonce/create" },
  ],
]

[test.expected]
error = "MalformedPayload"

[[test]]
name      = "nonce_sha256_with_33_bytes_fails"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "raw:SHA-256:paWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWl", typ = "cyphr.me/cyphr/AT/KT/nonce/create" },
  ],
]

[test.expected]
error = "MalformedPayload"

# nonce/delete of a nonce the level does not hold.
[[test]]
name      = "nonce_delete_absent_fails"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "bob", typ = "cyphr.me/cyphr/AT/KT/nonce/delete" },
  ],
]

[test.expected]
error = "UnknownNonce"

# The same nonce created twice at one level (SPEC 7.6).
[[test]]
name      = "nonce_create_twice_at_one_level_fails"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "bob", typ = "cyphr.me/cyphr/AT/KT/nonce/create" },
  ],
]

[[test.commit]]
tx = [
  [
    { now = 1700000001, signer = "golden", target = "bob", typ = "cyphr.me/cyphr/AT/KT/nonce/create" },
  ],
]

[test.expected]
error = "DuplicateNonce"
