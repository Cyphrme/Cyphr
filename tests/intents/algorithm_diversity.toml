# Algorithm diversity tests

# Test 1: ES384 account adds ES256 key
[[test]]
name      = "es384_account_adds_es256_key"
principal = ["diana_es384"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "diana_es384", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[test.expected]
key_count = 2
level     = 3

# Test 2: Ed25519 account adds ES256 key
[[test]]
name      = "ed25519_account_adds_es256_key"
principal = ["eve_ed25519"]

[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "eve_ed25519", target = "key_a", typ = "cyphr.me/cyphr/key/create" },
  ],
]

[test.expected]
key_count = 2
level     = 3

# A two-algorithm principal (SHA-256 and SHA-384 keys) with a data commit.
# The ds/create's id names DR under the signer's algorithm only; in the
# SHA-384 variant tree the DR node is not calculated and stays null
# (SPEC 12.2), so DR carries one variant and SR, PR carry both.
[[test]]
name      = "two_algorithm_data_commit"
principal = ["golden", "diana_es384"]

[[test.action]]
msg    = "Data under two algorithms"
now    = 1700000001
signer = "golden"
typ    = "cyphr.me/action"

[[test.commit]]
tx = [
  [
    { now = 1700000002, signer = "golden", typ = "cyphr.me/cyphr/ds/create" },
  ],
]

[test.expected]
key_count = 2
level     = 4
