# Replayed data action is ignored (SPEC §7.6)
# The identical signed action is submitted twice; the replay produces no
# state change, so exactly one action is recorded.
[[test]]
name      = "replayed_action_is_ignored"
principal = ["golden"]

# The genesis commit (SPEC 5.1): a data action needs a principal to
# record into.
[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "golden", typ = "cyphr.me/cyphr/key/create" },
  ],
  [
    { now = 1700000000, signer = "golden", typ = "cyphr.me/cyphr/principal/create" },
  ],
]

[[test.action]]
msg    = "Replayed action"
now    = 1700000001
signer = "golden"
typ    = "cyphr.me/action"

[[test.action]]
msg    = "Replayed action"
now    = 1700000001
signer = "golden"
typ    = "cyphr.me/action"

[test.expected]
level = 4
