# Level 4 Action Test Vectors
# Per SPEC 4.8 - a data action is recorded in DT; DR enters PR only by a
# signed ds/create whose id is the computed DR = MR(DT) (SPEC 4.8.2).

# Test 1: Single action direct promotion
# DR = czd for a single action (a lone node is promoted), included by
# ds/create
[[test]]
name      = "single_action_promotes_ds"
principal = ["golden"]

[[test.action]]
msg    = "First action"
now    = 1700000001
signer = "golden"
typ    = "cyphr.me/action"

[[test.commit]]
tx = [
  [
    { now = 1700000002, signer = "golden", typ = "cyphr.me/cyphr/ds/create" },
  ],
]

[test.expected]
level = 4

# Test 2: Multiple actions sorted
# DR = H(sort(czd₀, czd₁...)) (SPEC 4.8.1: ordered by now, then lexical),
# included by ds/create
[[test]]
name      = "multiple_actions_sorted"
principal = ["golden"]

[[test.action]]
msg    = "First action"
now    = 1700000001
signer = "golden"
typ    = "cyphr.me/action"

[[test.action]]
msg    = "Second action"
now    = 1700000002
signer = "golden"
typ    = "cyphr.me/action"

[[test.commit]]
tx = [
  [
    { now = 1700000003, signer = "golden", typ = "cyphr.me/cyphr/ds/create" },
  ],
]

[test.expected]
level = 4

# A ds/create sets DR to its signed id (SPEC 4.8.2), never checked against
# the actions held (2.3.3: DT is a point-in-time snapshot). The id is the DR
# over golden's "First action" of single_action_promotes_ds (a lone action's
# czd, promoted), an action this principal never receives; DR, SR and PR
# derive from it.
[[test]]
name      = "ds_create_sets_dr_to_signed_id"
principal = ["golden"]

[[test.commit]]
tx = [
  [
    { now = 1700000002, signer = "golden", id = "SHA-256:MDysJnIKSmGSGuOoO4awid_auCK2OKyDSLzVMBuxLi4", typ = "cyphr.me/cyphr/ds/create" },
  ],
]

[test.expected]
key_count = 1

# Test 3: An action alone leaves PR unchanged
# DT/DR is first empty; without a ds/create the action is in DT but DR is
# not in PR (SPEC 4.8.2), so PR stays the PR of the genesis commit
[[test]]
name      = "action_alone_leaves_pr"
principal = ["golden"]

# The genesis commit (SPEC 5.1): a data action needs a principal to
# record into.
[[test.commit]]
tx = [
  [
    { now = 1700000000, signer = "golden", target = "golden", typ = "cyphr.me/cyphr/key/create" },
  ],
  [
    { now = 1700000000, signer = "golden", typ = "cyphr.me/cyphr/principal/create" },
  ],
]

[[test.action]]
msg    = "First action"
now    = 1700000001
signer = "golden"
typ    = "cyphr.me/action"

[test.expected]
level = 4

