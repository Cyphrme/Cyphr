# Example cyphr-server configuration. Every key below is one the binary
# accepts today (rs/cyphr-server/src/config.rs); see
# docs/guides/operating-a-server.md for what each buys.
#
# `admission` and `limits` are TOML-only: no flag or CYPHR_* variable sets
# them. Everything else can be overridden by flags or environment.
#
# Keyless by default: with no signing_key_path the server stores and serves
# commits but cannot sign receipts or issue logins. To run keyed, set
# signing_key_path and audience together (configure both or neither).

listen = "127.0.0.1:3000" # ":0" picks a free port and prints it
data_dir = "/var/lib/cyphr"
mode = "authority"
log_format = "pretty" # "json" for a log pipeline

# signing_key_path = "/etc/cyphr/signing-key.json"
# audience = "login.example.com"

# Witness mode instead pulls from an upstream:
# mode = "witness"
# authority_url = "https://authority.example.com"

[admission]
policy = "open" # or "invite" with tokens_path = "/var/lib/cyphr/invites.txt"

[limits]
max_body_bytes = 2097152
count_quota = 1000000
per_ip = { per_second = 100, burst = 200 }
read = { per_second = 100, burst = 200 }
push = { per_second = 50, burst = 100 }
login = { per_second = 50, burst = 100 }
revoke = { per_second = 50, burst = 100 }
